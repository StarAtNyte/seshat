[package]
name = "zlib-reader"
version = "0.1.0"
edition = "2021"
description = "Lightweight Z-Library desktop client (search + download) — native UI, no webview"
license = "MIT"

[dependencies]
eframe = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "socks", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rfd = "0.15"

zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
md-5 = "0.10"
hayro = "0.9"
fontdb = "0.24"

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"
lto = true
strip = true
