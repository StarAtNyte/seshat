[package]
name = "seshat"
version = "0.3.0"
edition = "2021"
description = "Seshat: a fast, native ebook reader for EPUB, MOBI/AZW3, FB2, PDF, CBZ and TXT"
license = "MIT"
repository = "https://github.com/StarAtNyte/seshat"
build = "build.rs"
readme = "README.md"

[dependencies]
eframe = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "socks", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rfd = "0.15"

zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
md-5 = "0.10"
hayro = "0.9"
fontdb = "0.24"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.deb]
name = "seshat"
maintainer = "Seshat contributors"
section = "text"
priority = "optional"
extended-description = "A fast, native ebook reader for EPUB, MOBI/AZW3, FB2, PDF, CBZ and TXT with highlights, notes, search, read-aloud and progress sync."
depends = "$auto"
assets = [
  ["target/release/seshat", "usr/bin/", "755"],
  ["packaging/linux/seshat.desktop", "usr/share/applications/", "644"],
  ["assets/icons/seshat-256.png", "usr/share/icons/hicolor/256x256/apps/seshat.png", "644"],
  ["assets/icons/seshat-512.png", "usr/share/icons/hicolor/512x512/apps/seshat.png", "644"],
]

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"
lto = true
strip = true
